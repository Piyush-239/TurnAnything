<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <g transform="translate(100, 50)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="300" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Controls container -->
    <rect x="50" y="60" width="500" height="190" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Header inside tool -->
    <text x="70" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Resize Dimensions</text>
    <text x="70" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Scale down image resolutions to reduce base file weight</text>
    
    <!-- Width Input -->
    <text x="70" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e4e4e7">Max Width (px)</text>
    <rect x="180" y="138" width="120" height="28" rx="6" fill="#18181b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="195" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">1200</text>
    
    <!-- Aspect ratio lock icon -->
    <g transform="translate(320, 152)" stroke="#10b981" stroke-width="1.5" fill="none">
      <rect x="-8" y="-8" width="16" height="16" rx="3"/>
      <path d="M -3,-3 L 3,3 M 3,-3 L -3,3"/>
    </g>
    <text x="345" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#10b981" font-weight="bold">Ratio Locked</text>

    <!-- Height Input (Auto calculated) -->
    <text x="70" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e4e4e7">Max Height (px)</text>
    <rect x="180" y="188" width="120" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="195" y="206" font-family="system-ui, sans-serif" font-size="13" fill="#71717a">Auto (900)</text>
  </g>
</svg>
