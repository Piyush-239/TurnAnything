<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <g transform="translate(100, 50)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="300" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Dots for browser buttons -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="35" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="50" cy="20" r="5" fill="#10b981" opacity="0.8"/>
    <rect x="80" y="10" width="440" height="20" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="300" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#71717a" text-anchor="middle">turnanything.xyz/tools/image-compressor</text>

    <!-- Upload Zone Container -->
    <rect x="40" y="60" width="520" height="200" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Upload Icon -->
    <g transform="translate(300, 130)">
      <circle cx="0" cy="-10" r="24" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M -8,-2 L 0,-10 L 8,-2" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0,-10 L 0,8" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
    <text x="300" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Drag and drop your image here</text>
    <text x="300" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Supports PNG, JPEG, WebP, GIF up to 50MB</text>
    <rect x="230" y="215" width="140" height="30" rx="6" fill="#ffffff" stroke-width="0"/>
    <text x="300" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#09090b" text-anchor="middle">Select Image File</text>
  </g>
</svg>
