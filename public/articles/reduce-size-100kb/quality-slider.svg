<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <g transform="translate(100, 50)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="300" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Controls container -->
    <rect x="50" y="60" width="500" height="190" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Header inside tool -->
    <text x="70" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Quality Optimization</text>
    <text x="70" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">Set compression level to hit the target &lt;100KB</text>
    
    <!-- Format selector -->
    <text x="70" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e4e4e7">Output Format</text>
    <rect x="180" y="130" width="80" height="24" rx="4" fill="#27272a" stroke="#10b981" stroke-width="1"/>
    <text x="220" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">WEBP</text>
    
    <rect x="270" y="130" width="80" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="310" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#a1a1aa" text-anchor="middle">JPEG</text>
    
    <rect x="360" y="130" width="80" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="400" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#a1a1aa" text-anchor="middle">PNG</text>

    <!-- Slider component -->
    <text x="70" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e4e4e7">Quality Slider</text>
    <line x1="180" y1="190" x2="480" y2="190" stroke="#27272a" stroke-width="6" stroke-linecap="round"/>
    <line x1="180" y1="190" x2="405" y2="190" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="405" cy="190" r="10" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    
    <!-- Quality tooltip bubble -->
    <rect x="385" y="155" width="40" height="20" rx="4" fill="#10b981"/>
    <text x="405" y="169" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">75%</text>

    <text x="500" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#10b981">75%</text>
  </g>
</svg>
