<svg viewBox="0 0 800 450" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Glowing background shapes -->
  <circle cx="200" cy="300" r="130" fill="#10b981" opacity="0.15" filter="url(#blur)"/>
  <circle cx="650" cy="150" r="140" fill="#3b82f6" opacity="0.1" filter="url(#blur)"/>
  <rect x="400" y="200" width="200" height="150" rx="75" fill="#8b5cf6" opacity="0.12" filter="url(#blur)"/>
  
  <!-- Clean premium abstract grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Visual Element -->
  <g transform="translate(400, 200)">
    <!-- Outer glassmorphic frame -->
    <rect x="-180" y="-100" width="360" height="200" rx="24" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <rect x="-180" y="-100" width="360" height="200" rx="24" fill="none" stroke="url(#glow)" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Inside graphics -->
    <circle cx="-90" cy="0" r="45" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="-90" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">ORIGINAL</text>
    <text x="-90" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4.8 MB</text>

    <!-- Arrow connection -->
    <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" fill="none">
      <path d="M -25,0 L 25,0"/>
      <path d="M 15,-6 L 25,0 L 15,6"/>
    </g>
    
    <circle cx="90" cy="0" r="45" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="90" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">TARGET SIZE</text>
    <text x="90" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt; 100 KB</text>
  </g>

  <!-- Footer labels -->
  <text x="400" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">TurnAnything Publishing Engine</text>
  <text x="400" y="405" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">How to Reduce Image Size Below 100KB Locally</text>
</svg>
