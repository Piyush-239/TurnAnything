<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <g transform="translate(100, 50)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="300" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Left panel: Original -->
    <rect x="30" y="50" width="250" height="200" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <!-- Abstract landscape placeholder inside original -->
    <path d="M 40,210 L 100,120 L 160,180 L 220,130 L 270,210 Z" fill="#27272a" opacity="0.4"/>
    <circle cx="210" cy="100" r="15" fill="#3f3f46" opacity="0.3"/>
    <rect x="40" y="215" width="230" height="25" rx="4" fill="#18181b"/>
    <text x="50" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">Original: 8.2 MB</text>

    <!-- Right panel: Optimized -->
    <rect x="320" y="50" width="250" height="200" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <!-- Same landscape but optimized -->
    <path d="M 330,210 L 390,120 L 450,180 L 510,130 L 560,210 Z" fill="#3b82f6" opacity="0.15"/>
    <circle cx="500" cy="100" r="15" fill="#3b82f6" opacity="0.1"/>
    <rect x="330" y="215" width="230" height="25" rx="4" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="340" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10b981">Compressed: 1.3 MB (Saved 84%)</text>
    
    <!-- Comparison divider line -->
    <line x1="300" y1="50" x2="300" y2="250" stroke="#27272a" stroke-width="2"/>
    <circle cx="300" cy="150" r="16" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="300" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#a1a1aa" text-anchor="middle">VS</text>
  </g>
</svg>
