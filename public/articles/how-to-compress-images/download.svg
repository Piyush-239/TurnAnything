<svg viewBox="0 0 800 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
  <g transform="translate(100, 50)">
    <!-- Browser Mockup Window -->
    <rect width="600" height="300" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Success card wrapper -->
    <rect x="100" y="60" width="400" height="180" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    
    <!-- Success icon -->
    <g transform="translate(300, 110)">
      <circle cx="0" cy="0" r="22" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M -7,0 L -2,5 L 7,-4" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="300" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Compression Complete!</text>
    <text x="300" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Your image has been compressed successfully locally.</text>
    
    <!-- Action button -->
    <rect x="200" y="195" width="200" height="32" rx="6" fill="#10b981"/>
    <text x="300" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Download Image</text>
  </g>
</svg>
